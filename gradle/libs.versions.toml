[versions]
# Platform
paper-api = "1.21.11-R0.1-SNAPSHOT"

# Winter Framework
winter-paper = "2.1.5"
winter-configuration = "2.0.2"
winter-command = "2.0.0"

# Commands & Configuration
cloud-paper = "2.0.1"
cloud-annotations = "2.1.0"
configurate = "4.2.0"

# Utilities & Metrics
caffeine = "3.2.3"
faststats = "0.29.0"

# Plugins
shadow = "9.2.2"

[libraries]
# Paper API
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }

# Winter Framework
winter-paper = { module = "com.thewinterframework:paper", version.ref = "winter-paper" }
winter-configuration = { module = "com.thewinterframework:configuration", version.ref = "winter-configuration" }
winter-command = { module = "com.thewinterframework:command", version.ref = "winter-command" }

# Commands & Configuration
cloud-paper = { module = "org.incendo:cloud-paper", version.ref = "cloud-paper" }
cloud-annotations = { module = "org.incendo:cloud-annotations", version.ref = "cloud-annotations" }
configurate-core = { module = "org.spongepowered:configurate-core", version.ref = "configurate" }
configurate-yaml = { module = "org.spongepowered:configurate-yaml", version.ref = "configurate" }

# Utilities & Metrics
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }
faststats-bukkit = { module = "dev.faststats.metrics:bukkit", version.ref = "faststats" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
